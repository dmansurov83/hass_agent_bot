version: "0.1.0"

ha:
  url: http://192.168.1.10:8123
  token: ""            # long-lived access token HA (или env HA_TOKEN)

tg:
  token: ""            # токен от @BotFather (или env TG_TOKEN)
  allow_user_ids:
    - 123456789        # твой Telegram user_id

llm:
  provider: gigachat           # gigachat | openai
  model: GigaChat-2-Pro
  credentials: ""              # GigaChat: Basic-ключ, OpenAI: API key (sk-...)
  base_url: ""                 # GigaChat: https://api.giga.chat (новый целевой URL, для Ultra обязательно)
                               # OpenAI: https://api.deepseek.com, http://localhost:11434/v1, ...

notify:
  debounce_seconds: 30
  entities:
    - binary_sensor.*
    - sensor.outdoor_temperature