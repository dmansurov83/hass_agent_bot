services:
  hass-agent-bot:
    image: dmansurov83/hass-agent-bot:latest
    container_name: hass-agent-bot
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - TG_TOKEN=${TG_TOKEN}
      - ALLOW_USERS=${ALLOW_USERS}
      - LLM_CREDENTIALS=${LLM_CREDENTIALS:-${GIGACHAT_CREDENTIALS:-}}
      - LLM_PROVIDER=${LLM_PROVIDER:-gigachat}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - DATA_DIR=/data
    volumes:
      # config.yaml — ФАЙЛ, не папка
      - ./config.yaml:/config.yaml:ro
      # персистентность таймеров
      - ./data:/data
    command: ["--config", "/config.yaml", "--console=false"]